# Opcional: publica Krono en internet con HTTPS usando Caddy.
# Requisitos: un dominio apuntando a tu IP pública y los puertos 80 y 443 abiertos en tu router.
# Uso (desde la carpeta raíz del proyecto):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.caddy.yml up -d --build

services:
  web:
    environment:
      COOKIE_SECURE: "true"
    # Con Caddy delante ya no hace falta publicar el 8080 a toda la red.
    # Lo dejamos solo en localhost para pruebas desde la propia PC.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    container_name: krono-caddy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      KRONO_DOMAIN: ${KRONO_DOMAIN:?Define KRONO_DOMAIN en el archivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
